<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Meta Ads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7f7f7;font-family:Inter,-apple-system,system-ui,sans-serif;color:#0a0b0d}
a{color:#0052ff;text-decoration:none}a:hover{color:#003ecc}
::-webkit-scrollbar{display:none}
.mono{font-family:'JetBrains Mono',monospace}
/* ---------- MOBILE ---------- */
.app{width:100%;max-width:430px;min-height:100vh;background:#fff;margin:0 auto;display:flex;flex-direction:column}
.app header{padding:18px 20px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;background:#ffffffe6;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid #dee1e6}
.hrow{display:flex;align-items:center;justify-content:space-between}
.acct{display:flex;align-items:center;gap:11px;cursor:pointer}
.avatar{width:32px;height:32px;border-radius:9999px;background:#0052ff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.title{font-weight:600;font-size:15px;letter-spacing:-.2px}
.sub{display:flex;align-items:center;gap:4px;font-size:12px;color:#5b616e}
.period{font-size:12px;font-weight:600;background:#eef0f3;border-radius:100px;padding:6px 12px}
.menu{position:absolute;top:64px;left:20px;background:#fff;border:1px solid #dee1e6;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);padding:6px;min-width:180px;z-index:20;display:none;flex-direction:column;gap:2px}
.menu.open{display:flex}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer}
.mi:hover{background:#eef0f3}
.mi .av{width:28px;height:28px;border-radius:9999px;background:#eef0f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.mi.sel{background:#eef0f3}.mi.sel .av{background:#0052ff;color:#fff}
.mi span{font-size:14px}.mi.sel span{font-weight:600}
.mi svg{margin-left:auto;display:none}.mi.sel svg{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:#fff;border:1px solid #dee1e6;border-radius:16px;padding:10px 10px 9px}
.kpi .l{font-size:10px;color:#7c828a;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;white-space:nowrap;margin-top:2px}
.chips{display:flex;gap:8px;padding:14px 20px 4px;overflow-x:auto}
.chip{border:none;background:#eef0f3;color:#0a0b0d;border-radius:100px;padding:9px 16px;font-size:14px;font-weight:600;font-family:Inter,sans-serif;white-space:nowrap;cursor:pointer}
.chip.on{background:#0052ff;color:#fff}
.app main{flex:1;padding:14px 0 32px;display:flex;flex-direction:column;gap:16px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px}
.mhead b{font-weight:600;font-size:18px;letter-spacing:-.2px}
.mhead small{font-size:12.5px;color:#5b616e}
.rail{display:flex;gap:14px;overflow-x:auto;padding:0 20px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.card{background:#fff;border:1px solid #dee1e6;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;flex:0 0 330px;scroll-snap-align:start}
.media{position:relative;width:100%;aspect-ratio:9/10;background:#eef0f3;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.media img,.media .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media .vid{background:#000}
.media .ph{color:#7c828a;font-size:13px;text-align:center;padding:0 30px}
.media.over{outline:2px solid #0052ff;outline-offset:-2px}
.rank{position:absolute;top:14px;left:14px;background:#0a0b0d;color:#fff;font-weight:700;font-size:14px;border-radius:100px;padding:6px 14px}
.sw{position:absolute;top:14px;right:14px;width:58px;height:32px;border-radius:100px;background:#0052ff;cursor:pointer;transition:background .2s}
.sw .kn{position:absolute;top:3px;left:29px;width:26px;height:26px;border-radius:9999px;background:#fff;transition:left .2s;box-shadow:0 1px 4px #0003}
.sw.off{background:#a8acb3}.sw.off .kn{left:3px}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;width:64px;height:64px;border-radius:9999px;background:#0a0b0dcc;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.body{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.hero{display:flex;align-items:center;justify-content:space-between;background:#eef0f3;border-radius:16px;padding:12px 16px}
.hero span{font-size:14px;color:#5b616e;font-weight:500}
.hero b{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:18px;color:#0052ff}
.names{display:flex;flex-direction:column;gap:4px}
.names .n{font-weight:600;font-size:16px;line-height:1.35}
.names .c{font-size:13px;color:#7c828a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;border-top:1px solid #eef0f3;padding-top:14px}
.mx .l{font-size:13px;color:#5b616e}
.mx .v{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:15px;margin-top:2px}
.foot{text-align:center;font-size:12px;color:#7c828a;padding:6px 20px 0}
/* ---------- DESKTOP ---------- */
.desk{display:none;min-height:100vh;background:#fff;flex-direction:column}
.desk .dhead{display:flex;align-items:center;justify-content:space-between;padding:20px 36px;border-bottom:1px solid #dee1e6}
.desk .brand{display:flex;align-items:center;gap:14px}
.desk .brand .avatar{width:36px;height:36px;font-size:16px}
.desk .brand .t{font-weight:700;font-size:17px;letter-spacing:-.01em}
.desk .brand .s{font-size:13px;color:#5b616e}
.desk .hright{display:flex;align-items:center;gap:12px}
.desk .datebox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dee1e6;border-radius:100px;padding:8px 14px;font-size:13.5px;color:#5b616e}
.desk .activebadge{background:#0052ff14;border:1px solid #0052ff40;color:#0052ff;border-radius:100px;padding:8px 14px;font-size:13px;font-weight:600}
.desk main{flex:1;padding:28px 36px;display:flex;flex-direction:column;gap:28px;max-width:1440px;width:100%;margin:0 auto}
.dkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dkpi{background:#fff;border:1px solid #dee1e6;border-radius:24px;padding:20px 22px}
.dkpi .l{font-size:13px;color:#5b616e;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dkpi .v{font-weight:700;font-size:30px;letter-spacing:-.02em;margin:6px 0}
.dkpi .s{font-size:13px;color:#5b616e}
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.panel{background:#fff;border:1px solid #dee1e6;border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.panel .ph2{display:flex;align-items:baseline;justify-content:space-between}
.panel .ph2 b{font-weight:600;font-size:16px}
.panel .ph2 small{font-size:13px;color:#5b616e}
.shares{display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1}
.share .row{display:flex;justify-content:space-between;font-size:13.5px;color:#5b616e;margin-bottom:5px}
.share .bar{height:8px;background:#eef0f3;border-radius:4px;overflow:hidden}
.share .fill{height:100%;background:#0052ff;border-radius:4px}
.tablecard{background:#fff;border:1px solid #dee1e6;border-radius:24px;overflow:hidden}
.tablecard .thead2{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px}
.tablecard .thead2 b{font-weight:600;font-size:16px}
.tablecard .thead2 small{font-size:13px;color:#5b616e}
.trow{display:grid;grid-template-columns:32px 2.2fr 1fr 1fr 1fr .8fr .8fr;gap:0 12px;padding:14px 24px;align-items:center;font-size:14.5px;border-bottom:1px solid #eef0f3;cursor:pointer}
.trow:hover{background:#f7f7f7}
.trow.hd{padding:10px 24px;font-size:12px;font-weight:700;color:#5b616e;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #dee1e6;cursor:default}
.trow.hd:hover{background:none}
.trow .chev{color:#0052ff;font-size:12px}
.trow .cname{display:flex;align-items:center;gap:10px}
.trow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.trow .obj{font-size:11.5px;color:#5b616e;background:#dee1e6;border-radius:5px;padding:2px 7px}
.trow .num{text-align:right;color:#5b616e}
.trow .num.b{color:#0a0b0d;font-weight:600}
.sub2{background:#f7f7f7;border-bottom:1px solid #eef0f3;padding:6px 24px 18px}
.arow{display:grid;grid-template-columns:32px 2.2fr 1fr 1fr 1fr .8fr .8fr;gap:0 12px;padding:8px 0;align-items:center;font-size:13.5px}
.arow .an{color:#5b616e;font-weight:600;padding-left:18px}
.arow .num{text-align:right;color:#5b616e}
.creatives{display:flex;gap:12px;padding-left:62px;flex-wrap:wrap}
.cr{background:#fff;border:1px solid #dee1e6;border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-width:280px}
.cr .thumb{width:52px;height:52px;border-radius:8px;background:linear-gradient(135deg,#eef0f3,#dee1e6);display:flex;align-items:center;justify-content:center;color:#5b616e;font-size:10px;flex-shrink:0;text-align:center}
img.cr-x,.cr img.thumb{object-fit:cover;display:block}
.cr .cn{font-size:13.5px;font-weight:600}
.cr .cs{font-size:12.5px;color:#5b616e;margin-top:3px}
.dfoot{display:flex;justify-content:space-between;font-size:12.5px;color:#7c828a;padding-bottom:8px}
@media (min-width:1024px){.app{display:none}.desk{display:flex}}
</style>
</head>
<body>
<!-- MOBILE -->
<div class="app">
<header>
  <div class="hrow">
    <div class="acct" id="acctBtn">
      <div class="avatar" id="acctAv">E</div>
      <div>
        <div class="title">Meta Ads</div>
        <div class="sub"><span id="acctName">Elvis</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5b616e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="menu" id="menu"></div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="chips" id="chips"></div>
<main>
  <div class="mhead"><b>Anúncios patrocinados</b><small><span id="count"></span> anúncios · deslize →</small></div>
  <div class="rail" id="rail"></div>
  <div class="foot" id="mFoot"></div>
</main>
</div>
<!-- DESKTOP -->
<div class="desk">
  <div class="dhead">
    <div class="brand">
      <div class="avatar">M</div>
      <div>
        <div class="t">Relatório Meta Ads</div>
        <div class="s"><span id="dAcct">Elvis</span> · Conta 2984-4471</div>
      </div>
    </div>
    <div class="hright">
      <div class="activebadge" id="dActive">—</div>
    </div>
  </div>
  <main>
    <div class="dkpis" id="dkpis"></div>
    <div class="charts">
      <div class="panel">
        <div class="ph2"><b>Investimento diário</b><small>julho 2026</small></div>
        <div style="flex:1;min-height:220px" id="chart"></div>
      </div>
      <div class="panel">
        <div class="ph2"><b>Investimento por campanha</b></div>
        <div class="shares" id="shares"></div>
      </div>
    </div>
    <div class="tablecard">
      <div class="thead2"><b>Campanhas</b><small>Com entrega no período · clique para ver conjuntos e anúncios</small></div>
      <div class="trow hd"><div></div><div>Campanha</div><div class="num">Investimento</div><div class="num">Impressões</div><div class="num">Alcance</div><div class="num">CPC</div><div class="num">CPM</div></div>
      <div id="tbody"></div>
    </div>
    <div class="dfoot"><span id="dNote"></span><span id="dStamp"></span></div>
  </main>
</div>
<script>
let ads=[],camps=[],daily=[],totalClicks=0,activeCount=0,period=null,loadError=null,loading=true;
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=v=>v.toLocaleString('pt-BR');
const pct=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const dec=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const kmil=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(v);
const ACCOUNTS=['Elvis','Wesley'];
const ACCOUNT_KEY={'Elvis':'elvis','Wesley':'wesley'};
const stored=localStorage.getItem('ma-account');
let filter='Todos',account=ACCOUNTS.includes(stored)?stored:'Elvis';
const open={};
const imgs=JSON.parse(localStorage.getItem('ma-imgs')||'{}');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
// nome do criativo sem a nomenclatura: tira os blocos [TAG] e o código do post no fim
function criativo(s){const t=String(s||'').replace(/\[[^\]]*\]/g,'').replace(/\s*\([^()]*\)\s*$/,'').replace(/\s+/g,' ').trim();return t||String(s||'')}
/* mobile */
function kpis(){
  const ts=ads.reduce((s,a)=>s+a.spend,0),ti=ads.reduce((s,a)=>s+a.imp,0),tr=ads.reduce((s,a)=>s+a.reach,0);
  document.getElementById('kpis').innerHTML=[['Gasto',brl(ts).replace(',00','')],['Impress.',kmil(ti)],['Alcance',kmil(tr)],['CPM',ti?brl(ts/ti*1000):'—']]
    .map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
}
function chips(){
  document.getElementById('chips').innerHTML=['Todos','REELS','FEED','STORIES']
    .map(f=>`<button class="chip${filter===f?' on':''}" data-f="${f}">${f==='Todos'?'Todos':f[0]+f.slice(1).toLowerCase()}</button>`).join('');
}
function cards(){
  const shown=ads.filter(a=>filter==='Todos'||a.format===filter);
  document.getElementById('count').textContent=shown.length;
  if(!shown.length){
    document.getElementById('rail').innerHTML=`<div style="padding:24px 20px;color:#7c828a;font-size:14px">${loading?'Carregando anúncios…':loadError?'Não foi possível carregar os anúncios.':'Nenhum anúncio com veiculação no período.'}</div>`;
    return;
  }
  document.getElementById('rail').innerHTML=shown.map((a,i)=>{
    const cpr=a.linkClicks>0?a.spend/a.linkClicks:0;
    const m=[['Gasto',brl(a.spend)],['Impress\u00f5es',int(a.imp)],['Alcance',int(a.reach)],['Frequ\u00eancia',dec(a.imp/a.reach)],['Cliques',int(a.clicks)],['Cliques no Link',int(a.linkClicks)],['CPM',brl(a.spend/a.imp*1000)],['CPC',a.clicks?brl(a.spend/a.clicks):brl(0)],['CPC Link',a.linkClicks?brl(a.spend/a.linkClicks):brl(0)],['CTR',pct(a.clicks/a.imp*100)],['CTR Link',pct(a.linkClicks/a.imp*100)],['CPR',brl(cpr)],['Receita',brl(a.revenue)],['ROAS',dec(a.spend?a.revenue/a.spend:0)+'x']];
    const real=a.video||a.thumb;
    const img=imgs[a.id]?`<img src="${imgs[a.id]}" alt="">`
      :a.video?`<video class="vid" src="${a.video}"${a.thumb?` poster="${a.thumb}"`:''} controls playsinline preload="metadata"></video>`
      :a.thumb?`<img src="${a.thumb}" alt="">`
      :`<div class="ph">Arraste o criativo do v\u00eddeo aqui<br>ou clique para escolher</div>`;
    return `<article class="card"><div class="media" data-id="${a.id}"${real?'':' data-pick="1"'}${a.video?' data-video="1"':''}>${img}
      <div class="rank">#${i+1}</div>
      ${a.video?'':'<div class="play"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>'}</div>
    <div class="body">
      <div class="names"><div class="n">${esc(criativo(a.name))}</div></div>
      <div class="mx">${m.map(x=>`<div><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>
    </div></article>`;
  }).join('');
}
function menu(){
  document.getElementById('menu').innerHTML=ACCOUNTS.map(n=>`<div class="mi${n===account?' sel':''}" data-acc="${n}"><div class="av">${n[0]}</div><span>${n}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0052ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>`).join('');
  document.getElementById('acctName').textContent=account;
  document.getElementById('acctAv').textContent=account[0];
  document.getElementById('dAcct').textContent=account;
}
/* desktop */
function dkpis(){
  const ts=camps.reduce((s,c)=>s+c.spend,0),ti=camps.reduce((s,c)=>s+c.imp,0),tr=camps.reduce((s,c)=>s+c.reach,0),clicks=totalClicks;
  document.getElementById('dkpis').innerHTML=[
    ['Investimento',brl(ts),'total no per\u00edodo'],
    ['Impress\u00f5es',int(ti),'freq. m\u00e9dia '+(tr?dec(ti/tr):'—')],
    ['Alcance',int(tr),'pessoas \u00fanicas'],
    ['CPC / CPM',(clicks?brl(ts/clicks):'—')+' / '+(ti?brl(ts/ti*1000):'—'),int(clicks)+' cliques']
  ].map(k=>`<div class="dkpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('');
}
function chart(){
  const el=document.getElementById('chart');
  if(!daily.length){el.innerHTML='';return}
  const vals=daily.map(d=>d.spend),max=Math.max(...vals)||1,W=760,H=220,bw=W/daily.length,peak=vals.indexOf(Math.max(...vals));
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;display:block">`;
  vals.forEach((v,i)=>{s+=`<rect x="${(i*bw+2).toFixed(1)}" y="${(H-28-(v/max)*(H-48)).toFixed(1)}" width="${Math.max(bw-4,1).toFixed(1)}" height="${((v/max)*(H-48)).toFixed(1)}" rx="3" fill="${i===peak?'#0052ff':'#dee1e6'}"/>`});
  const step=Math.max(1,Math.ceil(daily.length/6));
  daily.forEach((d,i)=>{if(i%step&&i!==daily.length-1)return;const t=d.date.split('-');s+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-8}" fill="#7c828a" font-size="11" text-anchor="middle" font-family="Inter,sans-serif">${t[2]}/${t[1]}</text>`});
  s+=`<text x="${(peak*bw+bw/2).toFixed(1)}" y="${(H-32-(H-48)-8).toFixed(1)}" fill="#0052ff" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif">${brl(max).replace(',00','')}</text></svg>`;
  el.innerHTML=s;
}
function shares(){
  const ts=camps.reduce((s,c)=>s+c.spend,0);
  document.getElementById('shares').innerHTML=camps.map(c=>`<div class="share"><div class="row"><span>${c.name.split(' \u2014 ')[1]||c.name}</span><span>${brl(c.spend)}</span></div><div class="bar"><div class="fill" style="width:${(c.spend/ts*100).toFixed(1)}%"></div></div></div>`).join('');
}
function table(){
  const dots=['#0052ff','#05b169','#f4b000','#cf202f'];
  document.getElementById('tbody').innerHTML=camps.map((c,i)=>{
    let h=`<div class="trow" data-c="${i}"><div class="chev">${open[i]?'\u25bc':'\u25b6'}</div>
      <div class="cname"><span class="dot" style="background:${dots[i%4]}"></span><span style="font-weight:600">${criativo(c.name)}</span><span class="obj">${c.obj}</span>${c.active===false?'<span class="obj" style="background:#fde8ea;color:#cf202f">Pausada</span>':''}</div>
      <div class="num b">${brl(c.spend)}</div><div class="num">${int(c.imp)}</div><div class="num">${int(c.reach)}</div><div class="num">${brl(c.spend/(c.imp*.021))}</div><div class="num">${brl(c.spend/c.imp*1000)}</div></div>`;
    if(open[i]){
      h+=`<div class="sub2">`+c.adsets.map(a=>`<div style="margin-top:12px">
        <div class="arow"><div></div><div class="an">\u25b8 ${criativo(a.name)}</div><div class="num">${brl(a.spend)}</div><div class="num">${int(a.imp)}</div><div class="num">${int(a.reach)}</div><div class="num">${brl(a.spend/(a.imp*.021))}</div><div class="num">${brl(a.spend/a.imp*1000)}</div></div>
        <div class="creatives">${a.creatives.map(cr=>`<div class="cr">${cr.thumb?`<img class="thumb" src="${cr.thumb}" alt="" loading="lazy">`:'<div class="thumb">criativo</div>'}<div><div class="cn">${criativo(cr.name)}${cr.active===false?' <span style="font-weight:400;color:#a8acb3">· pausado</span>':''}</div><div class="cs">${int(cr.imp)} impress\u00f5es \u00b7 CPC ${brl(cr.cpc)}</div></div></div>`).join('')}</div>
      </div>`).join('')+`</div>`;
    }
    return h;
  }).join('');
}
function fmtRange(r){if(!r)return '—';const d=v=>{const t=v.split('-');return t[2]+'/'+t[1]};return d(r.since)+' – '+d(r.until)}
function chrome(){
  const range=loading?'…':loadError?'—':fmtRange(period);
  document.getElementById('dActive').textContent=loading?'…':loadError?'—':'Veiculando agora: '+activeCount;
  const note=loading?'Carregando dados da conta '+account+'…'
    :loadError?'Não foi possível carregar: '+loadError
    :'Dados reais da conta '+account+' · Meta Ads';
  document.getElementById('mFoot').textContent=loading||loadError?note:note+' · arraste imagens dos criativos para os cards';
  document.getElementById('dNote').textContent=note;
  document.getElementById('dStamp').textContent=loading||loadError?'':'Atualizado em '+new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
}
function render(){kpis();chips();cards();menu();dkpis();chart();shares();table();chrome()}
async function load(){
  loading=true;loadError=null;ads=[];camps=[];daily=[];totalClicks=0;activeCount=0;period=null;
  render();
  try{
    const r=await fetch('/api/insights?account='+ACCOUNT_KEY[account]);
    const j=await r.json().catch(()=>({error:'resposta inválida do servidor'}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    ads=j.ads||[];camps=j.camps||[];daily=j.daily||[];totalClicks=j.clicks||0;activeCount=j.activeCount||0;period=j.period||null;
  }catch(e){loadError=e.message||'falha de rede'}
  loading=false;render();
}
/* events */
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){filter=chip.dataset.f;chips();cards();return}
  if(e.target.closest('#acctBtn')){document.getElementById('menu').classList.toggle('open');return}
  const mi=e.target.closest('.mi');
  if(mi){account=mi.dataset.acc;localStorage.setItem('ma-account',account);document.getElementById('menu').classList.remove('open');load();return}
  if(!e.target.closest('#menu'))document.getElementById('menu').classList.remove('open');
  const tr=e.target.closest('.trow:not(.hd)');
  if(tr){const i=tr.dataset.c;open[i]=!open[i];table();return}
  const media=e.target.closest('.media[data-pick]');
  if(media){
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=()=>{if(inp.files[0])ingest(inp.files[0],media.dataset.id)};inp.click();
  }
});
function ingest(file,id){
  const r=new FileReader();
  r.onload=()=>{imgs[id]=r.result;try{localStorage.setItem('ma-imgs',JSON.stringify(imgs))}catch(e){}cards()};
  r.readAsDataURL(file);
}
document.addEventListener('dragover',e=>{const m=e.target.closest&&e.target.closest('.media');if(m){e.preventDefault();m.classList.add('over')}});
document.addEventListener('dragleave',e=>{const m=e.target.closest&&e.target.closest('.media');if(m)m.classList.remove('over')});
document.addEventListener('drop',e=>{const m=e.target.closest&&e.target.closest('.media');if(m){e.preventDefault();m.classList.remove('over');const f=e.dataTransfer.files[0];if(f)ingest(f,m.dataset.id)}});
load();
</script>
</body>
